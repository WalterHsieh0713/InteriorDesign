<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Scan Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, sans-serif; }
  #ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.6); color: #fff; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.5;
    max-width: 260px;
  }
  #ui input { display: block; margin-top: 6px; }
  #status { margin-top: 6px; color: #9f9; }
  #legend { margin-top: 8px; font-size: 12px; color: #ccc; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
  .label {
    color: #fff; background: rgba(0,0,0,0.7); padding: 2px 6px;
    border-radius: 4px; font-size: 11px; white-space: nowrap;
    pointer-events: none;
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="ui">
  <strong>Room Scan Viewer</strong>
  <input type="file" id="filePicker" accept="application/json,.json">
  <div id="status">Pick a room JSON file to load.</div>
  <div id="legend">
    <span class="swatch" style="background:#aaaaaa"></span>walls
    <span class="swatch" style="background:#8b5a2b"></span>doors
    <span class="swatch" style="background:#66ccff"></span>windows
    <span class="swatch" style="background:#66ff99"></span>openings
    <span class="swatch" style="background:#ffcc00"></span>objects
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function () {
  const statusEl = document.getElementById('status');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 1000);
  camera.position.set(5, 5, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const labelRenderer = new THREE.CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  const controls = new THREE.OrbitControls(camera, labelRenderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));
  scene.add(new THREE.AxesHelper(1));

  let roomGroup = null;

  const COLORS = {
    walls: 0xaaaaaa,
    doors: 0x8b5a2b,
    windows: 0x66ccff,
    openings: 0x66ff99,
    objects: 0xffcc00
  };

  function clearRoom() {
    if (roomGroup) {
      scene.remove(roomGroup);
      roomGroup.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      });
      roomGroup = null;
    }
  }

  // transform is a flat column-major array of 16 floats straight from the
  // app's JSON — this is exactly what Matrix4.fromArray() wants, no reorder.
  function applyTransform(object3d, transformArray) {
    const m = new THREE.Matrix4().fromArray(transformArray);
    const position = new THREE.Vector3();
    const quaternion = new THREE.Quaternion();
    const scale = new THREE.Vector3();
    m.decompose(position, quaternion, scale);
    object3d.position.copy(position);
    object3d.quaternion.copy(quaternion);
    object3d.scale.copy(scale);
  }

  function addSurface(group, surface, color) {
    const [w, h] = surface.dimensions;
    const geometry = new THREE.PlaneGeometry(w, h);
    const material = new THREE.MeshStandardMaterial({
      color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.7
    });
    const mesh = new THREE.Mesh(geometry, material);
    applyTransform(mesh, surface.transform);
    group.add(mesh);

    const wireframe = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry),
      new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.4, transparent: true })
    );
    mesh.add(wireframe);
  }

  function addObject(group, obj) {
    const [w, h, d] = obj.dimensions;
    const geometry = new THREE.BoxGeometry(w, h, d);
    const material = new THREE.MeshStandardMaterial({
      color: COLORS.objects,
      transparent: true,
      opacity: 0.85
    });
    const mesh = new THREE.Mesh(geometry, material);
    applyTransform(mesh, obj.transform);
    group.add(mesh);

    const div = document.createElement('div');
    div.className = 'label';
    div.textContent = `${obj.category} (${obj.confidence})`;
    const label = new THREE.CSS2DObject(div);
    label.position.set(0, h / 2 + 0.1, 0);
    mesh.add(label);
  }

  function frameScene(group) {
    const box = new THREE.Box3().setFromObject(group);
    if (box.isEmpty()) return;
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z, 1);

    controls.target.copy(center);
    camera.position.set(center.x + radius, center.y + radius * 0.8, center.z + radius);
    camera.near = radius / 100;
    camera.far = radius * 20;
    camera.updateProjectionMatrix();
    controls.update();
  }

  function loadRoom(data) {
    clearRoom();
    roomGroup = new THREE.Group();

    (data.walls || []).forEach((s) => addSurface(roomGroup, s, COLORS.walls));
    (data.doors || []).forEach((s) => addSurface(roomGroup, s, COLORS.doors));
    (data.windows || []).forEach((s) => addSurface(roomGroup, s, COLORS.windows));
    (data.openings || []).forEach((s) => addSurface(roomGroup, s, COLORS.openings));
    (data.objects || []).forEach((o) => addObject(roomGroup, o));

    scene.add(roomGroup);
    frameScene(roomGroup);

    statusEl.textContent = `Loaded room ${data.roomId || ''}: ${
      (data.walls || []).length} walls, ${(data.objects || []).length} objects.`;
  }

  document.getElementById('filePicker').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    statusEl.textContent = `Loading ${file.name}...`;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        loadRoom(data);
      } catch (err) {
        statusEl.textContent = `Failed to parse JSON: ${err.message}`;
      }
    };
    reader.onerror = () => {
      statusEl.textContent = 'Failed to read file.';
    };
    reader.readAsText(file);
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
